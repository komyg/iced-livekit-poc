[package]
name = "iced-pv-meet-poc"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18.2"
dotenvy = "0.15.7"
env_logger = "0.11"
iced = { version = "0.14.0", features = ["canvas", "tokio", "svg"] }
livekit = { version = "0.8.1", features = ["rustls-tls-native-roots"] }
livekit-api = "0.6.1"
nokhwa = { version = "0.10.11", features = ["input-avfoundation"]}
rtrb = "0.3.4"
rust-i18n = "4.2.1"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
# Same version wgpu 27 uses, so the test validates what the GPU will see.
naga = { version = "27.0.3", features = ["wgsl-in"] }

# nokhwa's YUYV -> RGBA decoder is a per-pixel Rust loop, we must optimize it,
# otherwise it costs 230 ms per 720p frame — 4 fps, against a camera-limited 30 fps.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

# https://www.namtao.com/rust/
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
